name: Android rebuild

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rebuild:
    name: Rebuild unsigned APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android Build Tools
        run: sdkmanager "build-tools;35.0.0"

      - name: Install Apktool 2.10.0
        shell: bash
        run: |
          curl --fail --location --retry 3 \
            https://github.com/iBotPeaches/Apktool/releases/download/v2.10.0/apktool_2.10.0.jar \
            --output "$RUNNER_TEMP/apktool.jar"
          printf '#!/usr/bin/env bash\nexec java -jar "%s" "$@"\n' "$RUNNER_TEMP/apktool.jar" \
            | sudo tee /usr/local/bin/apktool >/dev/null
          sudo chmod +x /usr/local/bin/apktool
          apktool --version

      - name: Rebuild APK
        run: apktool b app -o "$RUNNER_TEMP/almosaly-unsigned.apk"

      - name: Align APK
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -f -p 4 \
            "$RUNNER_TEMP/almosaly-unsigned.apk" \
            "$RUNNER_TEMP/almosaly-aligned.apk"
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -v 4 "$RUNNER_TEMP/almosaly-aligned.apk"
